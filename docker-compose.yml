# Local dev infra. Managed cloud (Atlas + Upstash) is the deploy target for the
# public link; this brings the same two services up locally so you can run the
# whole stack without cloud credentials.
services:
  mongo:
    image: mongo:7
    container_name: tatkal-mongo
    ports:
      - '27017:27017'
    volumes:
      - tatkal-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: tatkal-redis
    ports:
      - '6379:6379'

volumes:
  tatkal-mongo-data:
